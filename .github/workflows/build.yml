name: Build Andarium IPA (from source)

# =============================================================================
# Andarium 从源码构建（真实、完整、权威）流水线
# -----------------------------------------------------------------------------
# 依据上游 AGENTS.md / Andarium/README.md#build / docs/testing.md 的真实构建序列：
#
#   1) cmake --preset kernarium-ios-device-android
#   2) cmake --build   --preset kernarium-ios-device-android
#   3) Kernarium/scripts/package-ios-frameworks.sh --runtimes android
#   4) Andarium/scripts/stage-system-image.py
#   5) xcodebuild -project Andarium/Andarium.xcodeproj -scheme Andarium \
#          -destination 'generic/platform=iOS' build
#
# ⚠️ 硬前提（诚实声明，不可绕过）：
#   - Andarium 使用 Xcode 27 的 JSON 工程格式（project.xcproj），只有 Xcode 27 能读。
#   - GitHub 托管的 macOS runner（macos-13/14/15）只带 Xcode 16.x，跑不了第 5 步。
#   - 因此本工作流默认跑在【自建 runner】上，标签：self-hosted, macOS, ARM64。
#     在 Mac 上执行一次即可：
#       https://github.com/goodcode1024/Kernarium/settings/actions/runners/new
#     标签填：self-hosted,macOS,ARM64
#   - 运行需要：CMake ≥ 3.27 + Ninja + Xcode 27 + 约 15GB 磁盘（含 1GB 系统镜像）。
#   - 本仓库不签名：产出未签名 IPA，交给 AltStore / SideStore 用你的 Apple ID 签名侧载。
# =============================================================================

on:
  push:
    tags: ["*"]
  workflow_dispatch:

env:
  UPSTREAM: imxieyi/Kernarium
  TAG: andarium-1.1
  # 内核 bundle（11MB）与系统镜像（1.09GB）——目录名与 accepted-*.env 严格一致
  KERNEL_ASSET: android-6.18-arm64-4k-20261119-6.18.60-ca1.tar.gz
  KERNEL_DIR: android-6.18-arm64-4k-20261119-6.18.60-ca1
  IMAGE_ASSET: lineage24-mainline6.18-4k-20261121-los24-r29.tar.gz
  IMAGE_DIR: lineage24-mainline6.18-4k-20261121-los24-r29

jobs:
  build-ipa:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout (submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain (CMake + Ninja)
        run: |
          cmake --version
          ninja --version || brew install ninja
          xcodebuild -version

      - name: Fetch pinned dependencies
        run: |
          # 仓库唯一允许联网的依赖入口；预编译静态前缀（大，首次较慢）
          ./dependencies/prepare.sh

      - name: Configure Android runtime (CMake)
        run: cmake --preset kernarium-ios-device-android

      - name: Build Android runtime
        run: cmake --build --preset kernarium-ios-device-android

      - name: Download accepted kernel bundle + system image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .build/kernel/artifacts .build/android/releases
          gh release download "$TAG" --repo "$UPSTREAM" \
            --pattern "$KERNEL_ASSET" --pattern "$IMAGE_ASSET" --dir .downloads
          # 内核 bundle → .build/kernel/artifacts/<KERNEL_DIR>
          tar -xzf ".downloads/$KERNEL_ASSET" -C .build/kernel/artifacts
          # 系统镜像 → .build/android/releases/<IMAGE_DIR>
          tar -xzf ".downloads/$IMAGE_ASSET" -C .build/android/releases
          # 若 tar 顶层多包了一层同名目录，去掉注释并按需 strip-components：
          # find .build/android/releases -mindepth 2 -maxdepth 2 -name release-manifest.json \
          #   -exec sh -c 'mv "$(dirname "$1")"/* .build/android/releases/"$IMAGE_DIR"/' _ {} \;
          ls -lh .build/kernel/artifacts .build/android/releases

      - name: Package runtime frameworks
        run: Kernarium/scripts/package-ios-frameworks.sh --runtimes android

      - name: Stage system image (内置镜像，即开即用)
        run: Andarium/scripts/stage-system-image.py

      - name: Build app (unsigned, device)
        run: |
          xcodebuild \
            -project Andarium/Andarium.xcodeproj \
            -scheme Andarium \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find build/Build/Products -name '*.app' -maxdepth 3 | head -1)"
          echo "APP_PATH=$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Andarium-unsigned.ipa Payload
          rm -rf Payload
          ls -lh Andarium-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andarium-unsigned-ipa
          path: Andarium-unsigned.ipa
          retention-days: 7
