name: Build Andarium IPA (内置镜像)

# 打包（侧载用）流水线 —— 「内置镜像、即开即用」
# Andarium 把 LineageOS 系统镜像 + 内核 bundle 直接打包进 App（所以 App 约 1.2GB），
# 用户装上即可用，无需首次下载。本工作流复刻这一过程：
#   1) 下载预编译镜像资产（内核 bundle + 系统镜像）
#   2) stage-system-image.py 把它们嵌入 App
#   3) xcodebuild 编译并打包成未签名 .ipa
#   4) 未签名 IPA 交给 AltStore / SideStore 用你自己的 Apple ID 签名侧载
#
# 注意（诚实声明）：
# 1. Andarium 使用 Xcode 27 的 JSON 工程格式（project.xcproj），需要较新的
#    macOS runner（或自建 runner）。若 runner 的 Xcode 版本不够，请换带 Xcode 27 的镜像。
# 2. 上游 release 的资产名若变化，请同步修改下方 IMAGE_ASSET / KERNEL_ASSET / TAG。
# 3. 签名/公证需要开发者证书，本工作流刻意不做签名，产出未签名 IPA。

on:
  push:
    tags: ["*"]
  workflow_dispatch:

env:
  UPSTREAM: imxieyi/Kernarium
  TAG: andarium-1.1
  KERNEL_ASSET: android-6.18-arm64-4k-20261119-6.18.60-ca1.tar.gz
  IMAGE_ASSET: lineage24-mainline6.18-4k-20261121-los24-r29.tar.gz

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Download prebuilt kernel + system image (内置镜像)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .downloads
          gh release download "$TAG" --repo "$UPSTREAM" \
            --pattern "$KERNEL_ASSET" \
            --pattern "$IMAGE_ASSET" \
            --dir .downloads
          ls -lh .downloads

      - name: Stage system image into app
        run: |
          # 把下载的镜像/内核嵌入 App bundle，实现「即开即用」
          python3 Andarium/scripts/stage-system-image.py

      - name: Build (unsigned, device)
        run: |
          xcodebuild \
            -project Andarium/Andarium.xcodeproj \
            -scheme Andarium \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find build/Build/Products -name '*.app' -maxdepth 3 | head -1)"
          echo "APP_PATH=$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Andarium-unsigned.ipa Payload
          rm -rf Payload
          ls -lh Andarium-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andarium-unsigned-ipa
          path: Andarium-unsigned.ipa
          retention-days: 7
